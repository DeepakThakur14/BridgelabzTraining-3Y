<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Webpage</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            background: #f4f4f4;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 8%;
            background: #222;
            color: white;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        header nav {
            display: flex;
            gap: 25px;
        }

        header nav a {
            color: white;
            text-decoration: none;
        }

        main {
            flex: 1;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
            padding: 40px 8%;
        }

        article {
            background: white;
            padding: 30px;
            border-radius: 12px;
        }

        article h1 {
            margin-bottom: 30px;
            animation: titleAnimation 1s ease;
        }

        .boxes {
            display: flex;
            gap: 20px;
        }

        .box {
            flex: 1;
            min-height: 180px;
            padding: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: #e8e8e8;
            border-radius: 10px;
        }

        aside {
            background: white;
            padding: 30px;
            border-radius: 12px;
        }

        aside h2 {
            margin-bottom: 20px;
        }

        aside ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        footer {
            padding: 20px;
            text-align: center;
            background: #222;
            color: white;
        }

        @keyframes titleAnimation {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 700px) {
            header {
                flex-direction: column;
                gap: 20px;
            }

            main {
                grid-template-columns: 1fr;
            }

            .boxes {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

<header>
    <div class="logo">MyWebsite</div>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Projects</a>
        <a href="#">Contact</a>
    </nav>
</header>

<main>

    <article>
        <h1>Welcome to My Website</h1>

        <div class="boxes">
            <div class="box">
                <h2>Web Development</h2>
            </div>

            <div class="box">
                <h2>UI Design</h2>
            </div>

            <div class="box">
                <h2>Programming</h2>
            </div>
        </div>
    </article>

    <aside>
        <h2>Sidebar</h2>
        <ul>
            <li>Latest Posts</li>
            <li>Categories</li>
            <li>Projects</li>
            <li>Resources</li>
        </ul>
    </aside>

</main>

<footer>
    <p>© 2026 MyWebsite. All Rights Reserved.</p>
</footer>

</body>
</html>
