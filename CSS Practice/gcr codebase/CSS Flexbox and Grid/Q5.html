<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f4f4;
            padding: 40px;
        }

        .pricing {
            width: 100%;
            max-width: 1000px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 25px;
        }

        .card {
            flex: 1;
            min-height: 400px;
            padding: 35px 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
            transition: transform 0.4s ease;
            animation: fadeIn 1s ease forwards;
            opacity: 0;
        }

        .card:hover {
            transform: translateY(-10px);
        }

        .card h2 {
            margin-bottom: 20px;
        }

        .card .price {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .card p {
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .card button {
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            background: #222;
            color: white;
            cursor: pointer;
        }

        .popular {
            min-height: 440px;
            background: #dff1ff;
            transform: scale(1.05);
        }

        .card:nth-child(2) {
            animation-delay: 0.2s;
        }

        .card:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 750px) {
            .pricing {
                flex-direction: column;
            }

            .card,
            .popular {
                width: 100%;
                min-height: 350px;
                transform: none;
            }

            .popular:hover {
                transform: translateY(-10px);
            }
        }
    </style>
</head>
<body>

<section class="pricing">

    <div class="card">
        <h2>Basic</h2>
        <div class="price">₹499</div>
        <p>Perfect for beginners and small projects.</p>
        <button>Choose Plan</button>
    </div>

    <div class="card popular">
        <h2>Premium</h2>
        <div class="price">₹999</div>
        <p>Best choice for professional users and growing projects.</p>
        <button>Choose Plan</button>
    </div>

    <div class="card">
        <h2>Enterprise</h2>
        <div class="price">₹1999</div>
        <p>Advanced features for large organizations.</p>
        <button>Choose Plan</button>
    </div>

</section>

</body>
</html>
