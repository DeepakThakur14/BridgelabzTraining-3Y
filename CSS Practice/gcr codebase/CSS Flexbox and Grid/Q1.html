<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Portfolio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            background: #f4f4f4;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 8%;
            background: #222;
            color: white;
        }

        header h1 {
            font-size: 28px;
        }

        nav {
            display: flex;
            gap: 25px;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 50px;
            padding: 60px 8%;
        }

        .about {
            flex: 1;
            max-width: 550px;
        }

        .about h2 {
            font-size: 38px;
            margin-bottom: 20px;
        }

        .about p {
            line-height: 1.7;
            font-size: 18px;
        }

        .image-section {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image-section img {
            width: 300px;
            height: 300px;
            object-fit: cover;
            border-radius: 50%;
        }

        footer {
            text-align: center;
            padding: 20px;
            background: #222;
            color: white;
        }

        @media (max-width: 700px) {
            header {
                flex-direction: column;
                gap: 20px;
            }

            main {
                flex-direction: column;
                text-align: center;
            }

            .image-section img {
                width: 220px;
                height: 220px;
            }
        }
    </style>
</head>
