<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
        }

        .dashboard {
            min-height: 100vh;
            display: grid;
            grid-template-columns: 220px 1fr;
            grid-template-rows: 80px 1fr;
            grid-template-areas:
                "header header"
                "sidebar main";
            gap: 20px;
        }

        header {
            grid-area: header;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #222;
            color: white;
        }

        aside {
            grid-area: sidebar;
            padding: 25px;
            background: white;
        }

        aside nav {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        aside a {
            text-decoration: none;
            color: #222;
        }

        main {
            grid-area: main;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 20px;
            padding: 10px;
        }

        .box {
            min-height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .box:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
        }

        .box:first-child {
            grid-column: span 2;
        }

        @media (max-width: 700px) {
            .dashboard {
                grid-template-columns: 1fr;
                grid-template-rows: 80px auto 1fr;
                grid-template-areas:
                    "header"
                    "sidebar"
                    "main";
            }

            aside nav {
                flex-direction: row;
                justify-content: space-around;
                flex-wrap: wrap;
            }

            main {
                grid-template-columns: 1fr;
                grid-template-rows: auto;
            }

            .box:first-child {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>

<div class="dashboard">

    <header>
        <h1>Dashboard</h1>
    </header>

    <aside>
        <nav>
            <a href="#">Home</a>
            <a href="#">Profile</a>
            <a href="#">Reports</a>
            <a href="#">Settings</a>
        </nav>
    </aside>

    <main>
        <div class="box"><h2>Overview</h2></div>
        <div class="box"><h2>Sales</h2></div>
        <div class="box"><h2>Users</h2></div>
        <div class="box"><h2>Revenue</h2></div>
    </main>

</div>

</body>
</html>
