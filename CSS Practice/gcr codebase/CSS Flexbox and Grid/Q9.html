<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Flip</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
        }

        .card-container {
            width: 350px;
            height: 450px;
            perspective: 1000px;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s ease;
        }

        .card-container:hover .card {
            transform: rotateY(180deg);
        }

        .front,
        .back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .front {
            background: white;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .front img {
            width: 100%;
            height: 300px;
            object-fit: cover;
        }

        .front h2 {
            margin-top: 30px;
        }

        .back {
            background: #222;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            text-align: center;
            transform: rotateY(180deg);
        }

        .back p {
            line-height: 1.8;
            font-size: 18px;
        }
    </style>
</head>
<body>

<div class="card-container">
    <div class="card">

        <div class="front">
            <img src="https://picsum.photos/500/400" alt="Nature">
            <h2>Beautiful Nature</h2>
        </div>

        <div class="back">
            <p>
                Nature provides beautiful landscapes, peaceful environments
                and countless experiences that inspire us every day.
            </p>
        </div>

    </div>
</div>

</body>
</html>
