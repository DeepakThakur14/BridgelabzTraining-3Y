<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homepage</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 25px;
            background: #222;
            color: white;
        }

        nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 18px;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            padding: 50px;
            background: #f4f4f4;
        }

        .box {
            flex: 1;
            max-width: 300px;
            min-height: 220px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
            transition: transform 0.3s;
        }

        .box:hover {
            transform: rotate(2deg);
        }

        .box h2 {
            margin-bottom: 15px;
        }

        footer {
            width: 100%;
            text-align: center;
            padding: 20px;
            background: #222;
            color: white;
        }

        @media (max-width: 700px) {
            main {
                flex-direction: column;
            }

            .box {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<header>
    <nav>
        <a href="#">Home</a>
        <a href="#">Services</a>
        <a href="#">Projects</a>
        <a href="#">Contact</a>
    </nav>
</header>

<main>
    <section class="box">
        <h2>Services</h2>
        <p>We provide professional web development services.</p>
    </section>

    <section class="box">
        <h2>Projects</h2>
        <p>We create modern and responsive web projects.</p>
    </section>

    <section class="box">
        <h2>Contact</h2>
        <p>Contact us for your next web development project.</p>
    </section>
</main>

<footer>
    <p>© 2026 My Homepage</p>
</footer>

</body>
</html>
