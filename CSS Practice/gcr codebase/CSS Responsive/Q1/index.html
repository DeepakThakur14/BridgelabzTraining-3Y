<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>CSS Image Filter Gallery</h1>

    <div class="gallery">

        <div class="gallery-item blur">
            <img src="https://picsum.photos/id/1015/500/350" alt="Mountain">
            <p>Blur</p>
        </div>

        <div class="gallery-item grayscale">
            <img src="https://picsum.photos/id/1016/500/350" alt="Nature">
            <p>Grayscale</p>
        </div>

        <div class="gallery-item sepia">
            <img src="https://picsum.photos/id/1025/500/350" alt="Dog">
            <p>Sepia</p>
        </div>

        <div class="gallery-item brightness">
            <img src="https://picsum.photos/id/1035/500/350" alt="River">
            <p>Brightness</p>
        </div>

        <div class="gallery-item contrast">
            <img src="https://picsum.photos/id/1043/500/350" alt="Forest">
            <p>Contrast</p>
        </div>

        <div class="gallery-item hue">
            <img src="https://picsum.photos/id/1069/500/350" alt="Beach">
            <p>Hue Rotate</p>
        </div>

    </div>

</body>
</html>
