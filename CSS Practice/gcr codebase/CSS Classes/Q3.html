<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Showcase</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        header {
            background: #1f2937;
            color: white;
            text-align: center;
            padding: 35px 20px;
        }

        header h1 {
            margin-bottom: 10px;
        }

        header p {
            color: #d1d5db;
        }

        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 50px 25px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
        }

        figure {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
            transition: transform 0.3s ease;
        }

        .image-container {
            position: relative;
            overflow: hidden;
        }

        .image-container img {
            width: 100%;
            height: 230px;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }

        .image-container::after {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0);
            transition: background 0.3s ease;
        }

        .image-container:hover img {
            transform: scale(1.1);
        }

        .image-container:hover::after {
            background: rgba(0, 0, 0, 0.25);
        }

        figcaption {
            padding: 15px;
            text-align: center;
            font-size: 17px;
            font-weight: bold;
            color: #374151;
        }

        footer {
            background: #1f2937;
            color: white;
            text-align: center;
            padding: 20px;
        }

        @media (max-width: 900px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 700px) {
            .gallery {
                grid-template-columns: 1fr;
            }

            main {
                padding: 30px 20px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Image Showcase</h1>
        <p>Explore beautiful images with CSS hover effects</p>
    </header>

    <main>
        <section class="gallery">

            <figure>
                <div class="image-container">
                    <img src="https://picsum.photos/id/1015/600/400" alt="Mountain">
                </div>
                <figcaption>Beautiful Mountain</figcaption>
            </figure>

            <figure>
                <div class="image-container">
                    <img src="https://picsum.photos/id/1016/600/400" alt="Nature">
                </div>
                <figcaption>Peaceful Nature</figcaption>
            </figure>

            <figure>
                <div class="image-container">
                    <img src="https://picsum.photos/id/1018/600/400" alt="Landscape">
                </div>
                <figcaption>Natural Landscape</figcaption>
            </figure>

            <figure>
                <div class="image-container">
                    <img src="https://picsum.photos/id/1025/600/400" alt="Animal">
                </div>
                <figcaption>Beautiful Animal</figcaption>
            </figure>

            <figure>
                <div class="image-container">
                    <img src="https://picsum.photos/id/1035/600/400" alt="Forest">
                </div>
                <figcaption>Green Forest</figcaption>
            </figure>

            <figure>
                <div class="image-container">
                    <img src="https://picsum.photos/id/1043/600/400" alt="Beach">
                </div>
                <figcaption>Sunny Beach</figcaption>
            </figure>

        </section>
    </main>

    <footer>
        <p> Image Showcase Layout</p>
    </footer>

</body>
</html>
