<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styled Button Collection</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
            min-height: 100vh;
        }

        header {
            background: #1f2937;
            color: white;
            text-align: center;
            padding: 35px 20px;
        }

        header h1 {
            margin-bottom: 10px;
        }

        header p {
            color: #d1d5db;
        }

        main {
            min-height: 65vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .button-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.12);
        }

        .btn {
            padding: 13px 28px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .primary {
            background: #2563eb;
            color: white;
            border: 2px solid #2563eb;
        }

        .primary:hover {
            background: #1d4ed8;
            box-shadow: 0 5px 12px rgba(37, 99, 235, 0.35);
        }

        .primary:active {
            transform: scale(0.95);
        }

        .secondary {
            background: #6b7280;
            color: white;
            border: 2px solid #6b7280;
        }

        .secondary:hover {
            background: #4b5563;
            box-shadow: 0 5px 12px rgba(107, 114, 128, 0.35);
        }

        .secondary:active {
            transform: scale(0.95);
        }

        .outline {
            background: transparent;
            color: #2563eb;
            border: 2px solid #2563eb;
        }

        .outline:hover {
            background: #2563eb;
            color: white;
            box-shadow: 0 5px 12px rgba(37, 99, 235, 0.35);
        }

        .outline:active {
            transform: scale(0.95);
        }

        .btn:focus {
            outline: 4px solid rgba(37, 99, 235, 0.25);
            outline-offset: 3px;
        }

        .btn:disabled {
            background: #d1d5db;
            color: #6b7280;
            border-color: #d1d5db;
            cursor: not-allowed;
            box-shadow: none;
        }

        footer {
            background: #1f2937;
            color: white;
            text-align: center;
            padding: 20px;
        }

        @media (max-width: 600px) {
            .button-container {
                flex-direction: column;
                width: 100%;
                padding: 30px 20px;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Styled Button Collection</h1>
        <p>Different button styles using CSS</p>
    </header>

    <main>
        <section class="button-container">

            <button class="btn primary">
                Primary
            </button>

            <button class="btn secondary">
                Secondary
            </button>

            <button class="btn outline">
                Outline
            </button>

            <button class="btn" disabled>
                Disabled
            </button>

        </section>
    </main>

    <footer>
        <p>Styled Button Collection</p>
    </footer>

</body>
</html>
