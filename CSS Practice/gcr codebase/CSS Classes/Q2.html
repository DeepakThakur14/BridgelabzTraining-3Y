<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tooltip Demonstration</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            min-height: 100vh;
        }

        header {
            background: #1f2937;
            color: white;
            text-align: center;
            padding: 35px 20px;
        }

        header h1 {
            margin-bottom: 10px;
        }

        header p {
            color: #d1d5db;
        }

        main {
            min-height: 70vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .tooltip-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 50px;
            flex-wrap: wrap;
        }

        .tooltip-box {
            position: relative;
            display: inline-block;
        }

        .element {
            display: inline-block;
            padding: 18px 30px;
            background: #2563eb;
            color: white;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
        }

        .tooltip {
            position: absolute;
            bottom: calc(100% + 12px);
            left: 50%;
            transform: translateX(-50%);
            background: #111827;
            color: white;
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 14px;
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease-in-out;
        }

        .tooltip::after {
            content: "";
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border-width: 6px;
            border-style: solid;
            border-color: #111827 transparent transparent transparent;
        }

        .tooltip-box:hover .tooltip {
            opacity: 1;
            visibility: visible;
        }

        .tooltip-box:nth-child(2) .element {
            background: #16a34a;
        }

        .tooltip-box:nth-child(3) .element {
            background: #dc2626;
        }

        .tooltip-box:nth-child(4) .element {
            background: #9333ea;
        }

        footer {
            background: #1f2937;
            color: white;
            text-align: center;
            padding: 20px;
        }

        @media (max-width: 600px) {
            main {
                padding: 50px 20px;
            }

            .tooltip-container {
                flex-direction: column;
                gap: 60px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Tooltip Demonstration</h1>
        <p>Hover over the elements to view the tooltips</p>
    </header>

    <main>
        <section class="tooltip-container">

            <div class="tooltip-box">
                <span class="element">Home</span>
                <span class="tooltip">Go to Home Page</span>
            </div>

            <div class="tooltip-box">
                <span class="element">Profile</span>
                <span class="tooltip">View Your Profile</span>
            </div>

            <div class="tooltip-box">
                <span class="element">Settings</span>
                <span class="tooltip">Manage Settings</span>
            </div>

            <div class="tooltip-box">
                <span class="element">Help</span>
                <span class="tooltip">Get Help & Support</span>
            </div>

        </section>
    </main>

    <footer>
        <p> CSS Tooltip Demonstration</p>
    </footer>

</body>
</html>
