<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini User Interface</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #dbeafe, #f3e8ff);
            color: #1f2937;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #1f2937;
            color: white;
            text-align: center;
            padding: 30px 20px;
        }

        header h1 {
            margin-bottom: 8px;
        }

        header p {
            color: #d1d5db;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .card {
            width: 100%;
            max-width: 800px;
            background: white;
            padding: 35px;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
            display: flex;
            gap: 35px;
            align-items: center;
        }

        .image-section {
            flex: 1;
            text-align: center;
        }

        .image-section img {
            width: 100%;
            max-width: 280px;
            height: 220px;
            object-fit: cover;
            border-radius: 12px;
            border: 4px solid #e5e7eb;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
        }

        .form-section {
            flex: 1;
        }

        .form-section h2 {
            margin-bottom: 20px;
            color: #2563eb;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: 0.3s ease;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 90px;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 8px;
            border: 2px solid;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .submit-btn {
            background: #2563eb;
            border-color: #2563eb;
            color: white;
        }

        .submit-btn:hover {
            background: #1d4ed8;
            border-color: #1d4ed8;
            transform: translateY(-2px);
            box-shadow: 0 5px 12px rgba(37, 99, 235, 0.3);
        }

        .reset-btn {
            background: white;
            border-color: #6b7280;
            color: #374151;
        }

        .reset-btn:hover {
            background: #f3f4f6;
            transform: translateY(-2px);
            box-shadow: 0 5px 12px rgba(0, 0, 0, 0.12);
        }

        footer {
            background: #1f2937;
            color: white;
            text-align: center;
            padding: 20px;
        }

        @media (max-width: 700px) {
            .card {
                flex-direction: column;
                padding: 25px 20px;
            }

            .image-section,
            .form-section {
                width: 100%;
            }

            .image-section img {
                max-width: 100%;
            }

            .buttons {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Mini User Interface</h1>
        <p>A simple responsive user interface layout</p>
    </header>

    <main>
        <section class="card">

            <div class="image-section">
                <img src="https://picsum.photos/id/1015/500/400" alt="Beautiful Mountain">
            </div>

            <div class="form-section">
                <h2>Contact Us</h2>

                <form>
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input
                            type="text"
                            id="name"
                            placeholder="Enter your name"
                        >
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                        >
                    </div>

                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea
                            id="message"
                            placeholder="Write your message"
                        ></textarea>
                    </div>

                    <div class="buttons">
                        <button type="submit" class="btn submit-btn">
                            Submit
                        </button>

                        <button type="reset" class="btn reset-btn">
                            Reset
                        </button>
                    </div>
                </form>
            </div>

        </section>
    </main>

    <footer>
        <p>Mini User Interface Layout</p>
    </footer>

</body>
</html>
