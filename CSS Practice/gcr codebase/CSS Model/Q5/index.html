<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced CSS Selectors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Advanced CSS Selectors</h1>

    <main>
        <div class="container">
            <h2>Items List</h2>

            <ul class="items">
                <li><input type="text" placeholder="Enter your name"></li>
                <li><input type="email" placeholder="Enter your email"></li>
                <li><a href="https://www.google.com/">Google</a></li>
                <li><a href="https://github.com/DeepakThakur14">GitHub</a></li>
                <li><span>Special Item</span></li>
            </ul>

            <div class="info">
                <p>First paragraph inside info.</p>
                <p>Second paragraph inside info.</p>
                <p>Third paragraph inside info.</p>
            </div>
        </div>
    </main>

</body>
</html>
