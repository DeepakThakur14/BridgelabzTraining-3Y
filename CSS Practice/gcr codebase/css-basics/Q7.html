<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="style.css">
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background-color: #e8f4ff;
    color: #172a46;
}

/* Center Page */

.contact-page {
    min-height: 100vh;

    display: flex;

    justify-content: center;
    align-items: center;

    padding: 30px;
}

/* Form */

.contact-form {
    width: 100%;
    max-width: 550px;

    background-color: white;

    padding: 40px;

    border-radius: 15px;

    box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.15);
}

.contact-form h1 {
    text-align: center;

    font-size: 2.2rem;

    margin-bottom: 10px;
}

.intro {
    text-align: center;

    color: #667085;

    margin-bottom: 30px;
}

/* Fields */

.form-group {
    margin-bottom: 20px;
}

.form-group label {
    display: block;

    font-weight: bold;

    margin-bottom: 8px;
}

input,
textarea {
    width: 100%;

    padding: 13px;

    border: 2px solid #d0d7de;

    border-radius: 8px;

    font-size: 1rem;

    font-family: Arial, sans-serif;

    outline: none;

    transition:
        border-color 0.3s,
        box-shadow 0.3s;
}

/* Focus */

input:focus,
textarea:focus {
    border-color: #247ba0;

    box-shadow:
        0 0 0 3px rgba(36, 123, 160, 0.15);
}

textarea {
    resize: vertical;
}

/* Button */

button {
    width: 100%;

    padding: 13px;

    background-color: #172a46;

    color: white;

    border: none;

    border-radius: 8px;

    font-size: 1rem;

    font-weight: bold;

    cursor: pointer;

    transition: background-color 0.3s;
}

button:hover {
    background-color: #247ba0;
}

/* Mobile */

@media (max-width: 600px) {

    .contact-page {
        padding: 15px;
    }

    .contact-form {
        padding: 25px 20px;
    }
}
    </style>
</head>

<body>

    <main class="contact-page">

        <form class="contact-form">

            <h1>Contact Us</h1>

            <p class="intro">
                Have a question? Send us a message.
            </p>

            <div class="form-group">
                <label for="name">Name</label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="subject">Subject</label>

                <input
                    type="text"
                    id="subject"
                    name="subject"
                    placeholder="Enter subject"
                    required
                >
            </div>

            <div class="form-group">
                <label for="message">Message</label>

                <textarea
                    id="message"
                    name="message"
                    rows="5"
                    placeholder="Write your message..."
                    required
                ></textarea>
            </div>

            <button type="submit">Send Message</button>

        </form>

    </main>

</body>
</html>
