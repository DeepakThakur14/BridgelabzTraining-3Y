<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background-color: #eef2f6;
    color: #172a46;
}

/* Header */

header {
    text-align: center;
    padding: 40px 20px;

    background-color: #172a46;
    color: white;
}

header h1 {
    font-size: 2.5rem;
    margin-bottom: 10px;
}

/* Gallery */

.gallery {
    width: 90%;
    max-width: 1200px;

    margin: 50px auto;

    display: grid;
    grid-template-columns: repeat(3, 1fr);

    gap: 25px;
}

/* Photo */

.photo {
    position: relative;

    height: 250px;

    overflow: hidden;

    border-radius: 15px;

    box-shadow:
        0 8px 20px rgba(0, 0, 0, 0.18);

    background-color: white;
}

.photo img {
    width: 100%;
    height: 100%;

    object-fit: cover;

    display: block;

    transition: transform 0.4s ease;
}

/* Caption */

.caption {
    position: absolute;

    left: 0;
    bottom: 0;

    width: 100%;

    padding: 18px;

    background-color: rgba(0, 0, 0, 0.7);

    color: white;

    text-align: center;

    opacity: 0;

    transition: opacity 0.4s ease;
}

/* Hover */

.photo:hover img {
    transform: scale(1.1);
}

.photo:hover .caption {
    opacity: 1;
}

/* Tablet */

@media (max-width: 900px) {

    .gallery {
        grid-template-columns: repeat(2, 1fr);
    }
}

/* Mobile */

@media (max-width: 600px) {

    .gallery {
        grid-template-columns: 1fr;
    }
}
    </style>
</head>

<body>

    <header>
        <h1>My Photo Gallery</h1>
        <p>Beautiful Places Around the World</p>
    </header>

    <main class="gallery">

        <div class="photo">
            <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=800&q=80"
                 alt="Mountain">

            <div class="caption">
                Beautiful Mountains
            </div>
        </div>

        <div class="photo">
            <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80"
                 alt="Beach">

            <div class="caption">
                Peaceful Beach
            </div>
        </div>

        <div class="photo">
            <img src="https://images.unsplash.com/photo-1519501025264-65ba15a82390?auto=format&fit=crop&w=800&q=80"
                 alt="City">

            <div class="caption">
                Modern City
            </div>
        </div>

        <div class="photo">
            <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=800&q=80"
                 alt="Nature">

            <div class="caption">
                Green Nature
            </div>
        </div>

        <div class="photo">
            <img src="https://images.unsplash.com/photo-1518684079-3c830dcef090?auto=format&fit=crop&w=800&q=80"
                 alt="Desert">

            <div class="caption">
                Desert Landscape
            </div>
        </div>

        <div class="photo">
            <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=800&q=80"
                 alt="Lake">

            <div class="caption">
                Beautiful Lake
            </div>
        </div>

    </main>

    <footer>
        <p>&copy; 2026 My Photo Gallery</p>
    </footer>

</body>
</html>
