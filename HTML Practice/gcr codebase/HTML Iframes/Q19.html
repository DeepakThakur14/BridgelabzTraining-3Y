<!DOCTYPE html>
<html>
<head>
    <title>Form Security</title>
</head>
<body>

    <h2>Secure Form</h2>

    <form autocomplete="off">

        <label>Name:</label>
        <input type="text" name="name" required>

        <br><br>

        <label>Email:</label>
        <input type="email" name="email" required>

        <br><br>

        <label>Password:</label>
        <input type="password" name="password" required>

        <br><br>

        <input type="submit" value="Submit">

    </form>

    <p>
        Turning off autocomplete can improve security by preventing
        browsers from automatically storing and filling sensitive
        information such as passwords and other personal data.
    </p>

</body>
</html>
