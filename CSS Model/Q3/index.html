<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient Background</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h2>Gradient Background</h2>
    </header>

    <main>
        <section class="linear">
            <div class="content">
                <h1>Linear Gradient</h1>
                <p>This section uses a linear gradient background that smoothly changes from one color to another.</p>
            </div>
        </section>

        <section class="radial">
            <div class="content">
                <h1>Radial Gradient</h1>
                <p>This section uses a radial gradient background that spreads outward from the center.</p>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 Gradient Webpage</p>
    </footer>

</body>
</html>
