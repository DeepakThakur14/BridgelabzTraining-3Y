<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 30px;
        }

        .container {
            max-width: 450px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            margin-top: 10px;
        }

        #output {
            margin-top: 20px;
            padding: 15px;
            background: #e8f5e9;
        }

        #error {
            color: red;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Shopping Cart</h2>

        <form id="cartForm">
            <label for="name">Product Name</label>
            <input type="text" id="name" required>

            <label for="price">Price</label>
            <input type="number" id="price" min="0.01" step="0.01" required>

            <label for="quantity">Quantity</label>
            <input type="number" id="quantity" min="1" step="1" required>

            <button type="submit">Add Item</button>
        </form>

        <h3>Apply Coupon</h3>

        <input type="text" id="coupon" placeholder="e.g. SAVE20 or DISC10">

        <button type="button" id="applyCoupon">Apply Coupon</button>

        <p id="error"></p>

        <div id="output"></div>
    </div>

    <script>
        class Cart {
            constructor() {
                this.items = [];
                this.discount = 0;
            }

            addItem(name, price, quantity) {
                this.items.push({ name, price, quantity });
            }

            getTotal() {
                return this.items.reduce(
                    (total, item) => total + item.price * item.quantity,
                    0
                );
            }

            applyCoupon(code) {
                if (!/^(SAVE20|DISC10)$/.test(code)) {
                    return false;
                }

                this.discount = code === "SAVE20" ? 20 : 10;
                return true;
            }

            getFinalTotal() {
                return this.getTotal() * (1 - this.discount / 100);
            }
        }

        const cart = new Cart();

        const cartForm = document.getElementById("cartForm");
        const output = document.getElementById("output");
        const error = document.getElementById("error");

        function displayCart() {
            output.replaceChildren();

            const heading = document.createElement("h3");
            heading.textContent = "Cart Items";
            output.appendChild(heading);

            cart.items.forEach(item => {
                const paragraph = document.createElement("p");

                paragraph.textContent =
                    `${item.name} - ₹${item.price.toFixed(2)} × ${item.quantity} = ₹${(item.price * item.quantity).toFixed(2)}`;

                output.appendChild(paragraph);
            });

            const total = document.createElement("p");
            total.textContent = "Total: ₹" + cart.getTotal().toFixed(2);

            const discount = document.createElement("p");
            discount.textContent = "Discount: " + cart.discount + "%";

            const finalTotal = document.createElement("h3");
            finalTotal.textContent =
                "Final Total: ₹" + cart.getFinalTotal().toFixed(2);

            output.append(total, discount, finalTotal);
        }

        cartForm.addEventListener("submit", function(event) {
            event.preventDefault();

            const name = document.getElementById("name").value.trim();
            const price = Number(document.getElementById("price").value);
            const quantity = Number(document.getElementById("quantity").value);

            if (
                !name ||
                !Number.isFinite(price) ||
                price <= 0 ||
                !Number.isInteger(quantity) ||
                quantity < 1
            ) {
                return;
            }

            cart.addItem(name, price, quantity);

            cartForm.reset();
            error.textContent = "";

            displayCart();
        });

        document.getElementById("applyCoupon").addEventListener("click", function() {
            const code = document.getElementById("coupon").value.trim();

            if (cart.applyCoupon(code)) {
                error.style.color = "green";
                error.textContent = "Coupon applied successfully!";
            } else {
                error.style.color = "red";
                error.textContent = "Invalid coupon. Use SAVE20 or DISC10.";
            }

            displayCart();
        });

        displayCart();
    </script>

</body>
</html>
