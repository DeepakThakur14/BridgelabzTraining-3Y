<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Object Updater</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 30px;
        }

        .container {
            max-width: 400px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background: green;
            color: white;
            border: none;
            cursor: pointer;
        }

        #output {
            margin-top: 20px;
            background: #e8f5e9;
            padding: 15px;
            overflow-wrap: anywhere;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Update User Details</h2>

        <form id="userForm">
            <label for="name">Name</label>
            <input type="text" id="name" required>

            <label for="email">Email</label>
            <input type="email" id="email" required>

            <label for="age">Age</label>
            <input type="number" id="age" min="1" required>

            <button type="submit">Update User</button>
        </form>

        <div id="output"></div>
    </div>

    <script>
        const user = {
            name: "John",
            email: "john@mail.com",
            age: 21
        };

        const form = document.getElementById("userForm");
        const output = document.getElementById("output");

        document.getElementById("name").value = user.name;
        document.getElementById("email").value = user.email;
        document.getElementById("age").value = user.age;

        function displayUser() {
            output.replaceChildren();

            const heading = document.createElement("h3");
            heading.textContent = "Updated User Details";

            const nameParagraph = document.createElement("p");
            nameParagraph.textContent = "Name: " + user.name;

            const emailParagraph = document.createElement("p");
            emailParagraph.textContent = "Email: " + user.email;

            const ageParagraph = document.createElement("p");
            ageParagraph.textContent = "Age: " + user.age;

            output.append(
                heading,
                nameParagraph,
                emailParagraph,
                ageParagraph
            );
        }

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            user.name = document.getElementById("name").value.trim();
            user.email = document.getElementById("email").value.trim();
            user.age = Number(document.getElementById("age").value);

            displayUser();

            console.log(user);
        });

        displayUser();
    </script>

</body>
</html>
